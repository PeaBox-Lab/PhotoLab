name: Feature request
description: Suggest a user-focused improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed experience
      description: Describe the interaction and expected result.
    validations:
      required: true
  - type: dropdown
    id: privacy
    attributes:
      label: Does this require uploading data to a third party?
      options: ["No", "Yes", "Unsure"]
    validations:
      required: true
