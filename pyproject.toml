[project]
name = "peabox-photo-lab"
version = "0.2.30"
description = "A privacy-first, local photo editor built with Streamlit and Pillow."
requires-python = ">=3.10"
dependencies = ["streamlit>=1.40,<2.0", "Pillow>=11,<13", "numpy>=2,<3"]

[tool.ruff]
line-length = 120

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.7,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
testpaths = ["tests"]
